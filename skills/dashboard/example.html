<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse — analytics overview</title>
  <style>
    :root {
      --bg: #fafaf9; --fg: #1c1b1a; --muted: #6b6964; --border: #e6e4e0;
      --accent: #c96442; --surface: #ffffff; --good: #2f7d4a; --bad: #b53a2a;
    }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
    main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0 32px 32px; gap: 24px; }
    .topbar { padding: 24px 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .topbar h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
    .topbar .right { display: flex; align-items: center; gap: 12px; color: var(--muted); }
    button { font: inherit; cursor: pointer; padding: 7px 13px; border-radius: 6px; }
    .btn-primary { background: var(--accent); color: white; border: 1px solid var(--accent); }
    .btn-secondary { background: transparent; color: var(--fg); border: 1px solid var(--border); }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: stretch; grid-auto-rows: 1fr; }
    .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; min-width: 0; min-height: 88px; height: 100%; display: flex; flex-direction: column; box-sizing: border-box; }
    .kpi .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .kpi .value { font-size: 28px; letter-spacing: -0.02em; }
    .kpi .delta { font-size: 12px; margin-top: 4px; }
    .kpi .delta.up { color: var(--good); }
    .kpi .delta.down { color: var(--bad); }
    .panels-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; flex: 1; min-height: 0; align-items: stretch; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; min-width: 0; min-height: 160px; height: 100%; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; }
    .panel h3 { margin: 0 0 16px; font-size: 14px; font-weight: 500; flex: 0 0 auto; }
    .chart { flex: 1; min-height: 0; background: linear-gradient(180deg, rgba(201,100,66,0.06), transparent); border-bottom: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
    .chart svg { width: 100%; height: 100%; flex: 1; min-height: 0; display: block; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { text-align: left; padding: 10px 6px; border-top: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
    .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); }
    .pill.good { color: var(--good); border-color: rgba(47,125,74,0.3); }
    .pill.bad { color: var(--bad); border-color: rgba(181,58,42,0.3); }
    @media (max-width: 639px) {
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .panels-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar" data-od-id="topbar">
      <h1>Pulse · Overview · April 2026</h1>
      <div class="right">
        <button class="btn-secondary" type="button">Last 30 days ▾</button>
        <button class="btn-primary" type="button">Export</button>
      </div>
    </header>

    <section class="kpis" data-od-id="kpis">
      <div class="kpi"><div class="label">MRR</div><div class="value">$48.2K</div><div class="delta up">+12.4% MoM</div></div>
      <div class="kpi"><div class="label">Active accounts</div><div class="value">3,184</div><div class="delta up">+204 this month</div></div>
      <div class="kpi"><div class="label">Churn (30d)</div><div class="value">2.1%</div><div class="delta down">+0.4 pp</div></div>
      <div class="kpi"><div class="label">P95 latency</div><div class="value">182 ms</div><div class="delta up">-23 ms</div></div>
    </section>

    <div class="panels-row">
      <section class="panel" data-od-id="primary-chart">
        <h3>Revenue · 30 days ($K)</h3>
        <div class="chart">
          <svg viewBox="0 0 600 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="MRR trend in thousands" data-od-chart="line" data-od-series="38.2,39.1,40.4,41,42.3,43.1,44.5,45.2,46,47.1,47.8,48.2">
            <line x1="44" y1="172" x2="584" y2="172" stroke="currentColor" stroke-opacity="0.12"/>
            <line x1="44" y1="94" x2="584" y2="94" stroke="currentColor" stroke-opacity="0.12"/>
            <line x1="44" y1="16" x2="584" y2="16" stroke="currentColor" stroke-opacity="0.12"/>
            <line x1="44" y1="172" x2="584" y2="172" stroke="currentColor" stroke-opacity="0.25"/>
            <text x="36" y="176" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">38.2</text>
            <text x="36" y="98" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">43.2</text>
            <text x="36" y="20" text-anchor="end" font-size="10" fill="currentColor" opacity="0.55">48.2</text>
            <polyline fill="none" stroke="#c96442" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="44,172 93.1,158 142.2,137.7 191.3,128.3 240.4,108 289.5,95.6 338.5,73.7 387.6,62.8 436.7,50.3 485.8,33.2 534.9,22.2 584,16"/>
          </svg>
        </div>
      </section>
      <section class="panel" data-od-id="secondary-panel">
        <h3>Weekly signups</h3>
        <div class="chart">
          <svg viewBox="0 0 600 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Weekly signups bar chart" data-od-chart="bar" data-od-series="42,58,51,67,73,61,78">
            <line x1="44" y1="172" x2="584" y2="172" stroke="currentColor" stroke-opacity="0.25"/>
            <rect x="44" y="118.8" width="62.9" height="53.2" fill="#c96442" opacity="0.35"/>
            <rect x="114.9" y="72.1" width="62.9" height="99.9" fill="#c96442" opacity="0.55"/>
            <rect x="185.7" y="89.9" width="62.9" height="82.1" fill="#c96442" opacity="0.47"/>
            <rect x="256.6" y="44.3" width="62.9" height="127.7" fill="#c96442" opacity="0.69"/>
            <rect x="327.4" y="26.5" width="62.9" height="145.5" fill="#c96442" opacity="0.80"/>
            <rect x="398.3" y="63.2" width="62.9" height="108.8" fill="#c96442" opacity="0.58"/>
            <rect x="469.1" y="17.6" width="62.9" height="154.4" fill="#c96442" opacity="0.80"/>
          </svg>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
